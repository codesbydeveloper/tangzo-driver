plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id "com.google.gms.google-services"
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")

if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")

if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")

if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}


// ============================================================
// RELEASE KEYSTORE
// ============================================================

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}


android {
    namespace = "com.tangzo.driver"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = "11"
    }


    defaultConfig {
        applicationId = "com.tangzo.driver"

        minSdk = 24
        targetSdk = flutter.targetSdkVersion

        versionCode = 10
        versionName = flutterVersionName

        // Ship ARM ABIs only.
        // x86_64 libs from payment SDKs are excluded
        // because of Google Play 16 KB page-size requirements.
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }


    packaging {
        jniLibs {
            useLegacyPackaging = false

            excludes += [
                    "lib/x86_64/libcardioDecider.so",
                    "lib/x86_64/libcardioRecognizer.so",
                    "lib/x86_64/libcardioRecognizer_tegra2.so",
                    "lib/x86_64/libopencv_core.so",
                    "lib/x86_64/libopencv_imgproc.so",
            ]
        }
    }


    // ============================================================
    // SIGNING CONFIGURATION
    // ============================================================

    signingConfigs {

        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']

            storeFile keystoreProperties['storeFile'] ?
                    file(keystoreProperties['storeFile']) :
                    null

            storePassword keystoreProperties['storePassword']
        }
    }


    // ============================================================
    // BUILD TYPES
    // ============================================================

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false

            // Use the Driver release keystore.
            signingConfig signingConfigs.release
        }
    }

    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core-ktx:1.13.1'
            force 'androidx.core:core:1.13.1'
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    implementation platform('com.google.firebase:firebase-bom:33.2.0')
    implementation 'io.card:android-sdk:5.5.1'
    implementation 'com.tencent.mm.opensdk:wechat-sdk-android-without-mta:6.7.0'
    implementation 'com.google.android.gms:play-services-wallet:19.4.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    // implementation 'com.foloosi:FoloosiSDK:2.0.24'
    implementation 'com.google.code.gson:gson:2.10.1'
}

flutter {
    source = "../.."
}